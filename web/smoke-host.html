<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;background:#0e1116;color:#c9d4dc;font:16px -apple-system;display:grid;place-items:center}button{padding:12px}</style>
<body><main><h1>模拟宿主 / Test host</h1><button id="focus">原页面按钮</button></main>
<script>
document.querySelector('button').focus();
window.addEventListener('error',event=>window.webkit.messageHandlers.splash.postMessage('ERROR: '+event.message));
</script>
<script src="injection.js"></script>
<script>
if(window.__codexSplashState?.phase!=='playing') window.webkit.messageHandlers.splash.postMessage('ERROR: 注入未开始');
else {
  window.previewPlayer=window.CodexSplash.start();
  window.webkit.messageHandlers.splash.postMessage('STARTED');
  const timer=setInterval(()=>{
    const phase=window.__codexSplashState?.phase;
    if(phase==='complete'){clearInterval(timer);window.webkit.messageHandlers.splash.postMessage('COMPLETE');}
    else if(phase==='failed'||phase==='timeout'){clearInterval(timer);window.webkit.messageHandlers.splash.postMessage('ERROR: '+phase);}
  },100);
}
</script></body></html>
